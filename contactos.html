<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Le Boulevard Catering</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div id="header"></div>

    <main style="padding: 40px 20px; background-color: #FAFAFA;">
        
        <div class="section-header-premium">
            <h1 class="header-titulo-principal">Contáctanos y Cotiza tu Evento</h1>
            <p class="header-subtitulo-decorativo">Tu celebración, nuestra pasión</p>
            <p class="header-descripcion-corta">Estamos listos para ayudarte a organizar tu celebración con elegancia y puntualidad.</p>
            <div class="header-linea-separadora"></div>
        </div>

        <div class="contacto-layout-container">
            
            <section class="formulario-simple">
    <h2><i class="fa-solid fa-envelope-open-text"></i> Déjanos tus datos</h2>
    <form action="procesar_formulario.php" method="post">
    
        <div class="form-group">
            <label for="documento">DNI / RUC <span class="req">*</span></label>
            <input type="text" id="documento" name="documento" placeholder="Ej. 18120781 o 20601234567" required minlength="8" maxlength="11">
        </div>

        <div class="form-group">
            <label for="nombre">Nombre / Razón Social <span class="req">*</span></label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="form-group">
            <label for="correo">Correo electrónico <span class="req">*</span></label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono / WhatsApp <span class="req">*</span></label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ej. 924668399" required>
        </div>

        <div class="form-group">
            <label for="evento">Tipo de Evento <span class="req">*</span></label>
            <input type="text" id="evento" name="evento" placeholder="Ej. Boda, Corporativo" required>
        </div>

        <div class="form-group">
            <label for="invitados">Nro. aproximado de invitados <span class="req">*</span></label>
            <input type="number" id="invitados" name="invitados" placeholder="Ej. 100" min="1" required>
        </div>
        
        <div class="form-group">
            <label for="fecha">Fecha del evento <span class="req">*</span></label>
            <input type="date" id="fecha" name="fecha" required>
        </div>

        <div class="form-group">
            <label for="direccion">Lugar o Local (Trujillo) <span class="req">*</span></label>
            <input type="text" id="direccion" name="direccion" placeholder="Ej. Av. Larco 123 o Local Huanchaco" required>
        </div>

        <div class="form-group textarea-full">
            <label for="mensaje">Mensaje / Consulta <span class="req">*</span></label>
            <textarea id="mensaje" name="mensaje" rows="4" placeholder="Cuéntanos más detalles sobre lo que necesitas (menaje, cristaleria, mobilario, mozos, barman, caja china)..." required></textarea>
        </div>

        <div class="form-group textarea-full politicas-checkbox">
            <label for="privacidad">
                <input type="checkbox" id="privacidad" name="privacidad" required>
                <span>Acepto que mis datos serán utilizados con el objetivo de brindarme servicios, productos y asistencia, conformes a la política de privacidad. <a href="#">Política de privacidad</a> <span class="req">*</span></span>
            </label>
        </div>
    
        <div class="textarea-full">
            <button type="submit" class="btn-form">
                <i class="fa-solid fa-paper-plane"></i> ENVIAR MENSAJE
            </button>
        </div>
    </form>
</section>

            <div class="columna-derecha-cotizador">
                <div class="tarjeta-referencia-galeria">
                    <img src="img/Contactos/menaje-evento-02.webp" alt="Referencia menaje Le Boulevard" class="img-referencia">
                </div>

                <div class="tarjeta-cotizar-linea">
                    <h3><i class="fa-solid fa-box-open"></i> Cotiza tu evento en línea</h3>
                    <p>Si ya sabes lo que necesitas, te lo hacemos fácil. ¡Cotízalo en el momento!</p>
                    <a href="cotizaonline.html" class="btn-cotizar-online">
                        <i class="fa-solid fa-calculator"></i> Cotizar Online
                    </a>
                </div>
            </div>

        </div> 
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
    // Inicialización de tu clave pública de EmailJS
    emailjs.init("g3RUIpJGbe4DfDc69");

    document.querySelector('.formulario-simple form').addEventListener('submit', function(e) {
    e.preventDefault(); 

    // Captura ordenada de los 8 parámetros del formulario
    const documento = document.getElementById('documento').value;
    const nombre = document.getElementById('nombre').value;
    const correo = document.getElementById('correo').value;
    const telefono = document.getElementById('telefono').value;
    const evento = document.getElementById('evento').value;
    const invitados = document.getElementById('invitados').value; // Captura el texto del <select>
    const fecha = document.getElementById('fecha').value;
    const direccion = document.getElementById('direccion').value;
    const mensaje = document.getElementById('mensaje').value;

    // ==========================================
    // CANAL 1: ENVÍO INTEGRADO A EMAILJS
    // ==========================================
    const datosCorreo = {
        doc_identidad: documento,
        from_name: nombre,
        reply_to: correo,
        telefono_cliente: telefono,
        tipo_evento: evento,
        nro_invitados: invitados,
        fecha_evento: fecha,
        direccion_evento: direccion,
        message: mensaje
    };

// Recuerda cambiar estos parámetros por tus IDs de EmailJS reales
    emailjs.send("service_z9fmlon", "template_iayni6p", datosCorreo)
        .then(() => {
            console.log("Sincronización de correo completada con éxito.");
        }, (error) => {
            console.error("Error en el respaldo de correo:", error);
        });

    // ==========================================
    // CANAL 2: REDIRECCIÓN PROFESIONAL A WHATSAPP
    // ==========================================
    const numeroWhatsApp = "51924668399"; 

    const textoMensaje = `✨ *Nueva Consulta - Le Boulevard Catering* ✨%0A%0A` +
                         `🪪 *DNI/RUC:* ${documento}%0A` +
                         `👤 *Cliente:* ${nombre}%0A` +
                         `📧 *Correo:* ${correo}%0A` +
                         `📱 *Teléfono:* ${telefono}%0A` +
                         `🎉 *Evento:* ${evento}%0A` +
                         `👥 *Invitados:* ${invitados}%0A` +
                         `📅 *Fecha:* ${fecha}%0A` +
                         `📍 *Lugar:* ${direccion}%0A%0A` +
                         `💬 *Consulta:*%0A${mensaje}`;

    const urlFinal = `https://api.whatsapp.com/send?phone=${numeroWhatsApp}&text=${textoMensaje}`;
    
    // Abrir canal de atención
    window.open(urlFinal, '_blank');
    
    // Limpieza automática del formulario
    e.target.reset();
});
    </script>

    <div id="footer"></div>
    <script src="js/include.js"></script>

</body>
</html>
